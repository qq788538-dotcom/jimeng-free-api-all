version: '3.8'

services:
  jimeng-api:
    image: jimeng-free-api:latest
    container_name: jimeng-free-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
      - ./logs:/app/logs
    environment:
      - NODE_ENV=production
      - TZ=Asia/Shanghai
    restart: unless-stopped
